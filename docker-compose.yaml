services:
  db:
    container_name: postgres
    image: postgres:alpine
    environment:
      - POSTGRES_DB=analyzer_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=132435
    ports:
      - "6432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d analyzer_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data

  liquibase:
    container_name: liquibase
    image: liquibase/liquibase:4.25
    volumes:
      - ./liquibase/changelog:/liquibase/changelog
    environment:
      - LIQUIBASE_COMMAND_CHANGELOG_FILE=changelog.xml
    command: >
      --url="jdbc:postgresql://db:5432/analyzer_db"
      --changeLogFile=changelog.xml
      --username=admin
      --password=132435
      update
    depends_on:
      db:
        condition: service_healthy

  cache:
    container_name: redis
    image: redis:alpine
    ports:
      - "6380:6379"
      
volumes:
  pg_data:
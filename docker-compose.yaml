version: '3.8'

services:
  db:
    image: postgres:alpine
    environment:
      - POSTGRES_DB=analyzer_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=132435
    ports:
      - "6432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      
  cache:
    image: redis:alpine
    ports:
      - "6380:6379"
      
volumes:
  pg_data: